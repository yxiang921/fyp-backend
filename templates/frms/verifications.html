{% extends 'base.html' %}{% block content %}<h1>Verification requests</h1><table><tr><th>Request</th><th>Person</th><th>Alert</th><th>Status</th><th>Review</th></tr>{% for x in verifications %}<tr><td>{{x.request_id}}</td><td>{{x.full_name}}</td><td>{{x.alert_id}}</td><td>{{x.status}}</td><td>{% if x.status=='pending' %}<form method="post" action="{{url_for('review_verification',request_id=x.id)}}"><input name="jpn_notes" placeholder="JPN notes"><input name="police_notes" placeholder="Police notes"><button name="status" value="confirmed">Confirm</button><button class="stop" name="status" value="rejected">Reject</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
