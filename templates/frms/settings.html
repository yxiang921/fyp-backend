{% extends 'base.html' %}{% block content %}<h1>System settings</h1><section class="grid"><form method="post"><label>Key<input name="key" required></label><label>Value<textarea name="value"></textarea></label><label>Type<select name="type">{% for t in ['string','boolean','integer','json'] %}<option>{{t}}</option>{% endfor %}</select></label><label>Description<input name="description"></label><button>Save setting</button></form><article><table><tr><th>Key</th><th>Value</th><th>Type</th></tr>{% for x in settings %}<tr><td>{{x.key}}</td><td>{{x.value}}</td><td>{{x.type}}</td></tr>{% endfor %}</table></article></section>{% endblock %}
