{% extends 'base.html' %}{% block content %}<h1>Alerts</h1><table><tr><th>Alert</th><th>Person</th><th>Priority</th><th>Status</th><th>Assigned</th></tr>{% for x in alerts %}<tr><td><a href="{{url_for('alert_detail',alert_id=x.id)}}">{{x.alert_id}}</a></td><td>{{x.full_name}}</td><td>{{x.priority}}</td><td>{{x.status}}</td><td>{{x.assignee or 'Unassigned'}}</td></tr>{% endfor %}</table>{% endblock %}
