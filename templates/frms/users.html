{% extends 'base.html' %}{% block content %}<h1>User administration</h1><section class="grid"><form method="post"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><label>Role<select name="role">{% for r in ['super_admin','pdrm_officer','patrol_unit','public_user'] %}<option>{{r}}</option>{% endfor %}</select></label><label>Agency<input name="agency"></label><label>Phone<input name="phone"></label><button>Create user</button></form><article><table><tr><th>Name</th><th>Role</th><th>Active</th><th></th></tr>{% for x in users %}<tr><td>{{x.name}}<br><small>{{x.email}}</small></td><td>{{x.role}}</td><td>{{x.is_active}}</td><td><form method="post" action="{{url_for('toggle_user',user_id=x.id)}}"><button class="stop">Toggle</button></form></td></tr>{% endfor %}</table></article></section>{% endblock %}
