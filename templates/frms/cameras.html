{% extends 'base.html' %}{% block content %}<h1>Cameras</h1><section class="grid"><form method="post"><label>Camera ID<input name="camera_id" placeholder="CAM-001" required></label><label>Name<input name="name" required></label><label>Location<input name="location"></label><label>Stream URL<input name="stream_url"></label><label>Type<select name="stream_type">{% for s in ['rtsp','mjpeg','snapshot','hls','custom','webcam'] %}<option>{{s}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for s in ['online','offline','maintenance','error'] %}<option>{{s}}</option>{% endfor %}</select></label><button>Register camera</button></form><article><table><tr><th>ID</th><th>Name</th><th>Location</th><th>Status</th></tr>{% for x in cameras %}<tr><td>{{x.camera_id}}</td><td>{{x.name}}</td><td>{{x.location}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></article></section>{% endblock %}
