{% extends 'base.html' %}{% block content %}<h1>Missing-person cases</h1><section class="grid"><form method="post"><h2>New case</h2><label>Full name<input name="full_name" required></label><label>Gender<input name="gender"></label><label>Date of birth<input type="date" name="dob"></label><label>National ID<input name="national_id"></label><label>Last seen location<input name="last_seen_location" required></label><label>Last seen date<input type="datetime-local" name="last_seen_date"></label><label>Description<textarea name="description"></textarea></label><button>Create case</button></form><article><form class="inline-form" method="get"><input name="q" placeholder="Search name or case"><select name="status"><option value="">All statuses</option>{% for s in ['pending','active','found','closed','reopened'] %}<option>{{s}}</option>{% endfor %}</select><button>Search</button></form><table><tr><th>Case</th><th>Person</th><th>Status</th><th>Last seen</th></tr>{% for x in cases %}<tr><td><a href="{{ url_for('missing_person_detail',case_id=x.id) }}">{{x.case_number}}</a></td><td>{{x.full_name}}</td><td>{{x.status}}</td><td>{{x.last_seen_location}}</td></tr>{% endfor %}</table></article></section>{% endblock %}
