{% extends 'base.html' %}{% block content %}<h1>Detections</h1><table><tr><th>ID</th><th>Person</th><th>Camera</th><th>Score</th><th>Status</th><th>Time</th></tr>{% for x in detections %}<tr><td><a href="{{url_for('detection_detail',detection_id=x.id)}}">{{x.detection_id}}</a></td><td>{{x.full_name}}</td><td>{{x.camera_name}}</td><td>{{x.similarity_score}}%</td><td>{{x.status}}</td><td>{{x.detected_at}}</td></tr>{% endfor %}</table>{% endblock %}
