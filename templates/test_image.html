{% extends 'base.html' %}{% block content %}<h1>Image testing</h1><p>The returned image includes person boxes, face boxes, track ID, match name, and similarity.</p><form method="post" enctype="multipart/form-data"><label>Test image<input required name="image" type="file" accept="image/*"></label><label class="check"><input type="checkbox" name="send_alerts"> Create database detection and verification records</label><button>Run image recognition</button></form>
{% if result_data %}<h2>Annotated result</h2><img class="result-image" src="{{ result_data }}" alt="Annotated recognition result"><h2>Detections</h2><pre>{{ detections|tojson(indent=2) }}</pre>{% endif %}{% endblock %}
