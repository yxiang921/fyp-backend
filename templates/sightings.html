{% extends 'base.html' %}{% block title %}Sightings{% endblock %}{% block content %}<h1>Sighting reports</h1><section class="grid"><form method="post"><h2>Report a sighting</h2><label>Missing person<select name="missing_person_id" required><option value="">Select a case</option>{% for person in people %}<option value="{{ person.id }}">{{ person.case_number }} — {{ person.full_name }}</option>{% endfor %}</select></label><label>Location<input name="location" required></label><label>Details<textarea name="details"></textarea></label><button>Submit sighting</button></form><article><h2>Submitted reports</h2><table><tr><th>Person</th><th>Report</th><th>Recorded</th></tr>{% for row in sightings %}<tr><td>{{ row.full_name }}</td><td>{{ row.description }}</td><td>{{ row.created_at }}</td></tr>{% endfor %}</table></article></section>{% endblock %}
