{% extends 'base.html' %}{% block title %}Cases{% endblock %}{% block content %}<h1>Missing-person cases</h1><section class="grid"><form method="post"><h2>Submit a case</h2><label>Full name<input name="full_name" required></label><label>Gender<input name="gender"></label><label>Last seen location<input name="last_seen_location" required></label><label>Description<textarea name="description"></textarea></label><button>Submit case</button></form><article><h2>Case register</h2><table><tr><th>Case</th><th>Person</th><th>Status</th><th>Last seen</th></tr>{% for row in cases %}<tr><td>{{ row.case_number }}</td><td>{{ row.full_name }}</td><td>{{ row.status }}</td><td>{{ row.last_seen_location }}</td></tr>{% endfor %}</table></article></section>{% endblock %}
