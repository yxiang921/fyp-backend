{% extends 'base.html' %}{% block content %}<h1>Register missing person</h1><p>Use a clear image containing exactly one face. The face embedding is stored locally with the submitted profile details.</p>
<form method="post" enctype="multipart/form-data"><label>Full name<input required name="name" maxlength="100"></label><label>Age<input name="age" type="number" min="0" max="150"></label><label>Gender<input name="gender" maxlength="50"></label><label>Notes<textarea name="notes" rows="3"></textarea></label><label>Face photograph<input required name="image" type="file" accept="image/*"></label><button>Register person</button></form>
{% if result_url %}<h2>Registration preview</h2><img class="result-image" src="{{ result_url }}" alt="Registered face preview">{% endif %}{% endblock %}
